name: axion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axion}
      POSTGRES_DB: ${POSTGRES_DB:-axion}
    volumes:
      - axion-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axion} -d ${POSTGRES_DB:-axion}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./api
    # Named so the offline override (docker-compose.offline.yml) can reuse the
    # exact image that was just built for its probe, runner and workflow.
    image: axion-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion}@db:5432/${POSTGRES_DB:-axion}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      # Ignored in fixture mode, where the dataset's own name and window are
      # authoritative: seeding an event that has already closed and then letting a
      # value from the environment re-open it would make the acceptance result
      # depend on local configuration rather than on the code.
      EVENT_NAME: ${EVENT_NAME:-Axion Demo Hackathon}
      EVENT_START: ${EVENT_START:-}
      EVENT_END: ${EVENT_END:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MOCK_GITHUB: ${MOCK_GITHUB:-true}
      # The one-command path runs the *acceptance* dataset, not the showcase one:
      # `fixtures.json` at the root is the organisers' published file, loaded as
      # published, and its submissions_close is already in the past. That is the
      # posture the acceptance report is produced from, so it is the default.
      #
      #   SEED_MODE=demo   the crafted dataset every number in README.md and
      #                    JUDGING.md was computed against, with an open window
      #                    and the deliberate raw-average-vs-Z-score flip.
      SEED_MODE: ${SEED_MODE:-fixtures}
      # env or fixtures. In fixtures the event name and window come from the
      # dataset, so the seeded data and the announced event describe the same
      # thing and the imported deadline is genuinely enforced.
      EVENT_SOURCE: ${EVENT_SOURCE:-fixtures}
      SEED_DEMO: ${SEED_DEMO:-false}
      # One-flag alias for `SEED_MODE=fixtures EVENT_SOURCE=fixtures`. Still
      # honoured; no longer required, because that is now the default.
      DOGFOOD_FIXTURE_MODE: ${DOGFOOD_FIXTURE_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The fixture dataset sits at the repository root, which is not part of the
      # API build context; the volume below mounts the file and this names it.
      FIXTURES_PATH: /app/fixtures.json
    volumes:
      - ./fixtures.json:/app/fixtures.json:ro
    ports:
      - "8000:8000"
    healthcheck:
      # Readiness, not liveness: an instance that has not finished migrating or
      # seeding is not handed traffic (see api/app/readiness.py).
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 24
      # First boot runs migrations and the seed before uvicorn is useful.
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ./web
      # Baked into the build: Next resolves rewrite destinations at build time.
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  axion-db:
