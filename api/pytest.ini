[pytest]
# `postgres` marks the integration tests in `tests/pg/`, which need a real
# PostgreSQL server (AXION_TEST_DATABASE_URL) and build their schema with alembic
# rather than `Base.metadata.create_all`. They skip when no server is configured;
# `-m "not postgres"` runs the fast suite alone.
markers =
    postgres: integration tests that require a real PostgreSQL server
