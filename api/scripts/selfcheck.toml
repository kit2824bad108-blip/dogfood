# ─────────────────────────────────────────────────────────────────────────────
# Axion's own deeper self-check.
#
# This is NOT the DOGFOOD acceptance manifest. The organisers' manifest is at the
# repository root (`.dogfood.toml`, read by their `run.py`, seven checks) and that
# file is the one their suite reads. This one asks thirty-eight questions instead of
# seven — the blind gate, the exports, the Z-score leaderboard, the community
# surface, the webhook outbox, signed records, the bundle, anonymous boundaries —
# because a project should be able to check more than it is graded on.
#
# Do not merge the two. A claim verified only by its author is not evidence, and
# folding thirty-eight of our own assertions into the artefact the organisers read
# would blur exactly that line.
#
#   python api/scripts/dogfood_check.py api/scripts/selfcheck.toml \
#       --out acceptance-report.selfcheck.txt
#
# Both files are plain TOML and contain no secrets. This checker fetches its
# credentials from `auth.token_source`, a development-only endpoint that serves
# signed bearer tokens, so nothing here has to be edited per machine.
#
# The dataset below is the one `docker compose up` seeds: the organisers'
# fixtures.json, loaded as published — 41 projects including the deliberate
# duplicate submission, 30 judges, 40 teams, 8 tracks, and an event whose
# submissions_close is already in the past.
# ─────────────────────────────────────────────────────────────────────────────

[checker]
name = "axion-self-check"
manifest_version = 1
disclosure = "Axion's own deeper self-check. The organisers' acceptance report is acceptance-report.txt, produced by their run.py reading .dogfood.toml."

[service]
base_url = "http://127.0.0.1:8000"
health = "/api/health"
docs = "/api/docs"
openapi = "/api/openapi.json"

# The checker attaches headers. It never performs the login flow, and it never
# embeds a token: it reads them from `token_source` at run time. That endpoint is
# disabled unless the deployment is explicitly a demo.
[auth]
mode = "headers"
token_source = "/api/dev/checker-headers"
session_header = "Authorization"
bearer_prefix = "Bearer "

[auth.roles]
organizer = "organizer"
judge_a = "judge_a"
judge_b = "judge_b"
participant = "participant"

[dataset]
fixtures = "fixtures.json"
seed_mode = "fixtures"
expected_submissions = 41
expected_judges = 30
expect_closed_event = true

[expectations]
min_openapi_paths = 30
gallery_withholds = ["demo_url", "video_url"]
# Every "Dry …" project in the fixture data: Dry Compass, Dry Harbour, Dry Bridge,
# Dry Relay. The duplicate Dry Harbour is excluded from the public gallery, so the
# term matches four rows rather than five.
search_term = "dry"
search_expected_min = 3
closed_event_status_class = "4xx"

# ── T0 — the runtime answers at all ──────────────────────────────────────────

[[checks]]
id = "health"
group = "T0"
name = "Health endpoint answers"
method = "GET"
path = "/api/health"
role = "public"
expect = 200

[[checks]]
id = "openapi"
group = "T0"
name = "OpenAPI schema is served"
method = "GET"
path = "/api/openapi.json"
role = "public"
expect = 200

[[checks]]
id = "docs"
group = "T0"
name = "Interactive API docs are served"
method = "GET"
path = "/api/docs"
role = "public"
expect = 200

# ── T1 — the public surface ──────────────────────────────────────────────────

[[checks]]
id = "event"
group = "T1"
name = "Public event configuration"
method = "GET"
path = "/api/event"
role = "public"
expect = 200

[[checks]]
id = "gallery"
group = "T1"
name = "Public gallery lists projects"
method = "GET"
path = "/api/gallery"
role = "public"
expect = 200

[[checks]]
id = "gallery_search"
group = "T1"
name = "Gallery search returns matches"
method = "GET"
path = "/api/gallery?q={search_term}"
role = "public"
expect = 200

[[checks]]
id = "dataset"
group = "DATASET"
name = "Instance is running the declared dataset"
method = "GET"
path = "/api/event"
role = "public"
expect = 200

# The only write this check ever attempts. It is skipped rather than attempted
# when the event is open, so a demo instance is never mutated by a read-only run.
[[checks]]
id = "submit_closed"
group = "T1"
name = "Closed event rejects submissions"
method = "POST"
path = "/api/submissions"
role = "participant"
expect_class = "4xx"
body = { title = "Checker probe", repo_url = "https://github.com/axion-fixtures/checker-probe", status = "submitted" }

# ── T2 — judging ─────────────────────────────────────────────────────────────

[[checks]]
id = "judge_assignments"
group = "T2"
name = "Judge sees their assignments"
method = "GET"
path = "/api/judging/assignments"
role = "judge_a"
expect = 200

[[checks]]
id = "judge_technical"
group = "T2"
name = "Technical view withholds presentation links"
method = "GET"
path = "/api/judging/submissions/{submission_id}"
role = "judge_a"
expect = 200

[[checks]]
id = "judge_peer_scores"
group = "T2"
name = "A judge cannot read a peer's scores"
method = "GET"
path = "/api/judging/judges/jdg_01/scores"
role = "judge_b"
expect = 403

[[checks]]
id = "judge_own_scores"
group = "T2"
name = "A judge can read their own scores"
method = "GET"
path = "/api/judging/scores"
role = "judge_a"
expect = 200

[[checks]]
id = "presentation_gate"
group = "T2"
name = "Presentation stays locked until the technical verdict exists"
method = "GET"
path = "/api/judging/submissions/{submission_id}/presentation"
role = "judge_b"
expect = 403

[[checks]]
id = "leaderboard"
group = "T2"
name = "Z-score leaderboard ranks every project"
method = "GET"
path = "/api/admin/leaderboard"
role = "organizer"
expect = 200

# ── T3 — the community surface ───────────────────────────────────────────────

[[checks]]
id = "vote_window"
group = "T3"
name = "The community window is published, and its phase is reported"
method = "GET"
path = "/api/event"
role = "public"
expect = 200

# No token, no ballot. The token is what proves an address, so an unverified
# caller has nothing to read rather than a ballot with no name on it.
[[checks]]
id = "vote_ballot_needs_a_token"
group = "T3"
name = "A ballot is not readable without a token"
method = "GET"
path = "/api/vote/ballot"
role = "public"
expect = 401

# Either answer is correct, and both are observations: while the window is open
# the tally is refused *with its reason*, and once it closes the tally is public.
# Neither is a partial total, which is the thing the rule actually forbids.
[[checks]]
id = "vote_results_gating"
group = "T3"
name = "The tally is published once the window closes, and refused with a reason before"
method = "GET"
path = "/api/vote/results"
role = "public"
expect = [200, 403]

# An address that is not one never reaches a ballot. This is the only write-
# shaped T3 probe, and it is refused before anything is stored.
[[checks]]
id = "vote_register_validates"
group = "T3"
name = "An unverified address is refused before a ballot exists"
method = "POST"
path = "/api/vote/register"
role = "public"
expect = 422
body = { email = "not-an-address", name = "Checker probe" }

[[checks]]
id = "comments_public"
group = "T3"
name = "Project comment threads are public"
method = "GET"
path = "/api/submissions/{submission_id}/comments"
role = "public"
expect = 200

# ── T4 — outbound webhooks, signed records, the bundle and the embed ─────────

[[checks]]
id = "webhooks_console"
group = "T4"
name = "The webhook outbox is managed from the console"
method = "GET"
path = "/api/admin/webhooks"
role = "organizer"
expect = 200

[[checks]]
id = "webhooks_denied"
group = "T4"
name = "A participant cannot manage webhook receivers"
method = "GET"
path = "/api/admin/webhooks"
role = "participant"
expect = 403

[[checks]]
id = "webhooks_anonymous"
group = "T4"
name = "Anonymous callers cannot read the webhook queue"
method = "GET"
path = "/api/admin/webhooks"
role = "public"
expect = 401

[[checks]]
id = "bundle_export"
group = "T4"
name = "The whole event exports as one signed, credential-free bundle"
method = "GET"
path = "/api/admin/bundle/export"
role = "organizer"
expect = 200

[[checks]]
id = "bundle_export_denied"
group = "T4"
name = "A participant cannot export the event"
method = "GET"
path = "/api/admin/bundle/export"
role = "participant"
expect = 403

# An empty bundle is not a valid one: the import refuses it by name, whole, and
# writes nothing. `mode` is absent deliberately — the default is the dry run.
[[checks]]
id = "bundle_validate"
group = "T4"
name = "An unusable bundle is refused whole, by name"
method = "POST"
path = "/api/admin/bundle/validate"
role = "organizer"
expect = 200
body = { bundle = { bundle_version = 0 } }

[[checks]]
id = "records_overview"
group = "T4"
name = "The deployment states what it can prove, and with which key"
method = "GET"
path = "/api/records"
role = "public"
expect = 200

[[checks]]
id = "records_missing_code"
group = "T4"
name = "A code this deployment never issued does not verify"
method = "GET"
path = "/api/records/AXN-0000-0000"
role = "public"
expect = 404

[[checks]]
id = "records_issue_denied"
group = "T4"
name = "A participant cannot issue records"
method = "POST"
path = "/api/admin/records/issue"
role = "participant"
expect = 403
body = { judges = false, teams = false, winners = 0 }

[[checks]]
id = "embed_gallery"
group = "T4"
name = "The gallery embeds as a self-contained document"
method = "GET"
path = "/api/embed/gallery"
role = "public"
expect = 200
expect_content_type = "text/html"

[[checks]]
id = "embed_snippet"
group = "T4"
name = "The paste-ready embed snippet is generated, not hard-coded"
method = "GET"
path = "/api/embed/gallery/snippet"
role = "public"
expect = 200

# ── Exports: the artefact an organiser actually needs ────────────────────────

[[checks]]
id = "export_leaderboard"
group = "T2"
name = "Leaderboard CSV export"
method = "GET"
path = "/api/admin/export/leaderboard.csv"
role = "organizer"
expect = 200
expect_content_type = "text/csv"

[[checks]]
id = "export_scores"
group = "T2"
name = "Scores CSV export"
method = "GET"
path = "/api/admin/export/scores.csv"
role = "organizer"
expect = 200
expect_content_type = "text/csv"

[[checks]]
id = "export_progress"
group = "T2"
name = "Judging progress CSV export"
method = "GET"
path = "/api/admin/export/judging-progress.csv"
role = "organizer"
expect = 200
expect_content_type = "text/csv"

# ── AUTH — boundaries, checked from both sides ───────────────────────────────

[[checks]]
id = "session_identity"
group = "AUTH"
name = "Organizer header authenticates as an admin"
method = "GET"
path = "/api/auth/me"
role = "organizer"
expect = 200

[[checks]]
id = "participant_surface"
group = "AUTH"
name = "Participant reaches their own submission surface"
method = "GET"
path = "/api/submissions/me"
role = "participant"
expect = 200

[[checks]]
id = "participant_forbidden"
group = "AUTH"
name = "Participant cannot read the organizer leaderboard"
method = "GET"
path = "/api/admin/leaderboard"
role = "participant"
expect = 403

[[checks]]
id = "anonymous_forbidden"
group = "AUTH"
name = "Anonymous request cannot read the organizer leaderboard"
method = "GET"
path = "/api/admin/leaderboard"
role = "public"
expect = 401

# The ladder this deployment claims, checked against what was observed above. A
# tier counts only when every check in its group passed *and* every tier below it
# did, so a claim here can never be more generous than the evidence under it.
[[claims]]
tiers = ["T1", "T2", "T3", "T4"]
not_claimed = []
bonuses = ["normalization-proof", "api-first", "threat-model", "one-command"]
note = "T1–T4 are claimed; README.md carries the same table, and every claim there names the surface that proves it."
