# .dogfood.toml
#
# The four files DOGFOOD 2026 asks a project to agree on with the organisers.
# This is ours, in the shape the brief specifies, and it is read by the
# organisers' own checker:
#
#     docker compose up          # portal on http://localhost:3000
#     python3 run.py .dogfood.toml > acceptance-report.txt
#
# `run.py` and `fixtures.json` are at the root of this repository exactly as
# published. Nothing in this file is secret, and nothing in it is fetched: the
# checker attaches the header strings below verbatim, so they are printed by the
# seed at boot (`docker compose logs api`) and written here literally.
#
# Axion's own deeper self-check is a separate artefact and a separate manifest
# (`api/scripts/selfcheck.toml`), because it asks forty questions rather than
# seven and must never be mistaken for this report.

[portal]
# The portal, not the API: `[portal]` is where a visitor lands, and every one of
# the seven checks is answered through the same origin a browser uses. The web
# service proxies /api/* to FastAPI, so this proves the whole `docker compose up`
# path rather than just the engine behind it.
base_url = "http://localhost:3000"

[tiers]
# Honest claims only. run.py has seven checks and all seven are T1/T2, so this is
# the list it can actually verify; claiming T3 or T4 here would print
# "claimed T1 T2 T3 T4, verified T1 T2" and a note saying the claim was not
# checked. T3 and T4 *are* built (community ballots and comments; a signed webhook
# outbox, signed participation records, a whole-event bundle and an embeddable
# gallery) and they are claimed where the evidence exists:
#
#   api/scripts/selfcheck.toml  40 checks, T1-T4 all verified, read by
#                               api/scripts/dogfood_check.py -> acceptance-report.selfcheck.txt
#   api/scripts/acceptance.py   36 checks, tier by tier -> acceptance-report.axion.txt
#   api/tests/test_community.py, test_webhooks.py, test_records.py,
#   test_bundle_embed.py        36 tests over the same surfaces
#   api/tests/test_event_settings.py  32 tests over the organiser's clock, which is
#                               also where this file's `submissions_close` stops
#                               being the last word: an organiser can override it
#                               at run time, and the configuration stays underneath
#   README.md                   the tier table, with the surface behind each line
claimed = ["T1", "T2"]
pitch = "A self-hostable hackathon submission and judging portal: fixture-seeded, deadline-enforced in the API, with backend role isolation, weighted rubrics and a documented Z-score normalization — plus email-gated community voting, a signed webhook outbox and verifiable participation records."

[auth]
# Whatever header proves you are this role. Axion's session cookie is read from
# a cookie or a header, so a literal demo session is all a checker needs and no
# login round-trip is ever performed. These four are accepted only while the
# deployment is explicitly a demo or fixture instance (SEED_MODE / SEED_DEMO /
# MOCK_GITHUB / DOGFOOD_FIXTURE_MODE); a live event answers 401 to all four. The
# seed prints these exact lines at boot.
organizer   = "Cookie: session=axion-organizer-1"
judge_a     = "Cookie: session=axion-judge-a-1"
judge_b     = "Cookie: session=axion-judge-b-1"
participant = "Cookie: session=axion-participant-1"

[routes]
# Our routes, whatever we called them. These five are the ones run.py reads.
gallery      = "/api/gallery"
submit       = "/api/submissions"
# The caller's own filed scores: 200 for judge_a, 403 for a participant.
judge_scores = "/api/judging/scores"
# The url that returns judge_a's scores. judge_a is `jdg_01` in the fixture
# dataset; this endpoint exists precisely so that another judge asking for it is
# refused by the API with 403 rather than by a hidden link.
peer_scores  = "/api/judging/judges/jdg_01/scores"
csv_export   = "/api/admin/export/leaderboard.csv"

[dataset]
# Documentation for a reader, not read by the checker: which dataset
# `docker compose up` seeds, and what the fixture event's own window is.
# `submissions_close` is in the past, which is why the closed-event check passes:
# the deadline the portal enforces is the deadline the fixture declares.
source = "fixtures.json"
dialect = "organisers' fixtures.json"
event = "Sample Hack 2026"
submissions_close = "2026-03-01T18:00:00Z"
projects = 41
judges = 30
teams = 40
tracks = 8
scores = 126

# ── The surfaces this manifest does not name ─────────────────────────────────
#
# Documented for a reader, and for the two suites above that do exercise them.
# None of these is read by run.py: their checker has no T3/T4 checks, which is
# exactly why our own manifests carry the tier ladder instead.
[surfaces.t3]
ballot_register = "/api/vote/register"
ballot_verify   = "/api/vote/verify?token=..."
ballot          = "/api/vote/ballot"
vote            = "/api/vote"
results         = "/api/vote/results"
comments        = "/api/submissions/{id}/comments"
note = "A tally is refused with its reason until the window closes, and is readable by an organiser at any time."

[surfaces.t4]
webhooks     = "/api/admin/webhooks"
dispatch     = "/api/admin/webhooks/dispatch"
records      = "/api/records/{code}"
certificate  = "/api/records/{code}/certificate"
bundle       = "/api/admin/bundle/export"
embed        = "/api/embed/gallery"
note = "Delivery is signed sha256=<hex> over '<timestamp>.<body>'; records are signed over the payload as stored; the bundle carries no credentials."
