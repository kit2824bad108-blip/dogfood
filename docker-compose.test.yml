# A throwaway PostgreSQL for the integration suite (`api/tests/pg`).
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   cd api && AXION_TEST_DATABASE_URL=postgresql+psycopg://axion:axion@127.0.0.1:5433/axion_test \
#       AXION_REQUIRE_POSTGRES=1 python -m pytest tests/pg
#   docker compose -f docker-compose.test.yml down -v
#
# It is deliberately not part of `docker-compose.yml`: the event stack is what a
# deployment runs, and this is what the tests run. The port matches the URL in
# `api/tests/pg/conftest.py` so the documented command works unchanged.
#
# No volume: `down -v` should leave nothing behind, and the suite drops and
# recreates the `public` schema itself between runs.
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: axion
      POSTGRES_DB: axion_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_test"]
      interval: 2s
      timeout: 5s
      retries: 30
